[build]
  publish = "."

[[headers]]
  for = "/data/current-season.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/data/oct25-team-summaries.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/tracking/season-2026.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
