name: SCULLY Automatic Schedule and Performance Tracker

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scully-tracker
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit consistency and model parity
        run: node scripts/test_tracker.js

      - name: Snapshot pregame classifications and grade official finals
        run: node scripts/track_games.js

      - name: Commit only genuinely changed tracking records
        run: |
          if git diff --quiet -- data/tracking/season-2026.json; then
            echo 'No new snapshots or final results.'
            exit 0
          fi
          git config user.name 'SCULLY Data Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tracking/season-2026.json
          git commit -m 'SCULLY frozen pregame tracking and official NHL finals'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
